name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate release notes
        run: ./scripts/generate-release-body.sh "${{ github.ref_name }}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          fi

  build-cli:
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: darwin
            arch: x64
            cargo_target: 'x86_64-apple-darwin'
          - platform: 'macos-latest'
            os: darwin
            arch: arm64
            cargo_target: 'aarch64-apple-darwin'
          - platform: 'windows-latest'
            os: windows
            arch: x64
            cargo_target: ''
          - platform: 'windows-latest'
            os: windows
            arch: arm64
            cargo_target: 'aarch64-pc-windows-msvc'
          # Ubuntu 22.04 keeps glibc ≤ 2.35 for older distros.
          - platform: 'ubuntu-22.04'
            os: linux
            arch: x64
            cargo_target: ''
          - platform: 'ubuntu-22.04-arm'
            os: linux
            arch: arm64
            cargo_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Install macOS target
        if: matrix.cargo_target != '' && startsWith(matrix.platform, 'macos')
        run: rustup target add ${{ matrix.cargo_target }}

      - name: Install Windows ARM64 target
        if: matrix.cargo_target == 'aarch64-pc-windows-msvc'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build Frontend
        run: |
          npx svelte-kit sync
          vp build

      - name: Build cab binary
        shell: bash
        env:
          CAB_CARGO_TARGET: ${{ matrix.cargo_target }}
        run: |
          TARGET_ARGS=()
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            TARGET_ARGS=(--target "${CAB_CARGO_TARGET}")
          fi
          cargo build --release -p cab "${TARGET_ARGS[@]}"
          EXT=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then EXT=".exe"; fi
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            SRC="target/${CAB_CARGO_TARGET}/release/cab${EXT}"
          else
            SRC="target/release/cab${EXT}"
          fi
          mkdir -p resources/bin
          cp "$SRC" "resources/bin/cab${EXT}"
          rm -rf resources/ui
          cp -R build resources/ui

      - name: Package CLI archive
        shell: bash
        run: |
          chmod +x scripts/package-cli.sh scripts/install.sh
          ./scripts/package-cli.sh "${{ matrix.os }}" "${{ matrix.arch }}" dist/cli

      - name: Upload CLI archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          if [[ "$OS" == "windows" ]]; then
            ASSET="dist/cli/cab-${OS}-${ARCH}.zip"
          else
            ASSET="dist/cli/cab-${OS}-${ARCH}.tar.gz"
          fi
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cab-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/cli/*
          if-no-files-found: error
