name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate release notes
        run: ./scripts/generate-release-body.sh "${{ github.ref_name }}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          fi

  build-frontend:
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build Frontend
        run: |
          npx svelte-kit sync
          vp build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: cab-ui
          path: build/
          if-no-files-found: error

  build-cli:
    needs: [prepare-release, build-frontend]
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu latest: x64 native + arm64 cross via cross
          - platform: 'ubuntu-latest'
            os: linux
            arch: x64
            cargo_target: ''
            use_cross: false
          - platform: 'ubuntu-latest'
            os: linux
            arch: arm64
            cargo_target: 'aarch64-unknown-linux-gnu'
            use_cross: true
          # Windows latest: x64 native + arm64 cross
          - platform: 'windows-latest'
            os: windows
            arch: x64
            cargo_target: ''
            use_cross: false
          - platform: 'windows-latest'
            os: windows
            arch: arm64
            cargo_target: 'aarch64-pc-windows-msvc'
            use_cross: false
          # macOS latest (Apple Silicon): arm64 native + x64 cross
          - platform: 'macos-latest'
            os: darwin
            arch: arm64
            cargo_target: ''
            use_cross: false
          - platform: 'macos-latest'
            os: darwin
            arch: x64
            cargo_target: 'x86_64-apple-darwin'
            use_cross: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      # Install cross-compilation target toolchain
      - name: Install cross target
        if: matrix.cargo_target != ''
        run: rustup target add ${{ matrix.cargo_target }}

      # Install cross via pre-built binary (2-3 min faster than cargo install)
      - name: Install cross
        if: matrix.use_cross
        shell: bash
        run: |
          cd /usr/local/cargo/bin
          curl -sSfL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x cross

      # Download pre-built frontend artifact
      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: cab-ui
          path: build/

      - name: Build cab binary
        shell: bash
        env:
          CAB_CARGO_TARGET: ${{ matrix.cargo_target }}
          USE_CROSS: ${{ matrix.use_cross }}
        run: |
          TARGET_ARGS=()
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            TARGET_ARGS=(--target "${CAB_CARGO_TARGET}")
          fi
          if [[ "${USE_CROSS}" == "true" ]]; then
            cross build --profile ci -p cab "${TARGET_ARGS[@]}"
          else
            cargo build --profile ci -p cab "${TARGET_ARGS[@]}"
          fi
          EXT=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then EXT=".exe"; fi
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            SRC="target/${CAB_CARGO_TARGET}/ci/cab${EXT}"
          else
            SRC="target/ci/cab${EXT}"
          fi
          mkdir -p resources/bin
          cp "$SRC" "resources/bin/cab${EXT}"
          rm -rf resources/ui
          cp -R build resources/ui

      - name: Package CLI archive
        shell: bash
        run: |
          chmod +x scripts/package-cli.sh scripts/install.sh
          ./scripts/package-cli.sh "${{ matrix.os }}" "${{ matrix.arch }}" dist/cli

      - name: Upload CLI archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          if [[ "$OS" == "windows" ]]; then
            ASSET="dist/cli/cab-${OS}-${ARCH}.zip"
          else
            ASSET="dist/cli/cab-${OS}-${ARCH}.tar.gz"
          fi
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cab-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/cli/*
          if-no-files-found: error
