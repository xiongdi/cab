name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate release notes
        run: ./scripts/generate-release-body.sh "${{ github.ref_name }}"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          else
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "CAB ${{ github.ref_name }}" \
              --notes-file .github/release-body.md
          fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build Frontend
        run: |
          npx svelte-kit sync
          vp build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: cab-ui
          path: build/
          if-no-files-found: error

  build-cli:
    needs: [prepare-release, build-frontend]
    if: always() && (needs.build-frontend.result == 'success')
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: fully static musl (no glibc version floor)
          - platform: 'ubuntu-latest'
            os: linux
            arch: x64
            cargo_target: 'x86_64-unknown-linux-musl'
          - platform: 'ubuntu-latest'
            os: linux
            arch: arm64
            cargo_target: 'aarch64-unknown-linux-musl'
          # Windows latest: x64 native + arm64 cross
          - platform: 'windows-latest'
            os: windows
            arch: x64
            cargo_target: ''
          - platform: 'windows-latest'
            os: windows
            arch: arm64
            cargo_target: 'aarch64-pc-windows-msvc'
          # macOS latest (Apple Silicon): arm64 native + x64 cross
          - platform: 'macos-latest'
            os: darwin
            arch: arm64
            cargo_target: ''
          - platform: 'macos-latest'
            os: darwin
            arch: x64
            cargo_target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cargo_target }}

      - name: Install cross target
        if: matrix.cargo_target != ''
        run: rustup target add ${{ matrix.cargo_target }}

      # musl linker + aws-lc-sys build deps (cmake/ninja/perl)
      - name: Install Linux musl toolchain
        if: endsWith(matrix.cargo_target, '-linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.cargo_target }}

      - name: Install Linux musl build deps
        if: endsWith(matrix.cargo_target, '-linux-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build perl pkg-config

      # Download pre-built frontend artifact
      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: cab-ui
          path: build/

      - name: Build cab binary
        shell: bash
        env:
          CAB_CARGO_TARGET: ${{ matrix.cargo_target }}
        run: |
          TARGET_ARGS=()
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            TARGET_ARGS=(--target "${CAB_CARGO_TARGET}")
          fi
          cargo build --profile ci -p cab "${TARGET_ARGS[@]}"

          EXT=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then EXT=".exe"; fi
          if [[ -n "${CAB_CARGO_TARGET}" ]]; then
            SRC="target/${CAB_CARGO_TARGET}/ci/cab${EXT}"
          else
            SRC="target/ci/cab${EXT}"
          fi
          mkdir -p resources/bin
          cp "$SRC" "resources/bin/cab${EXT}"
          rm -rf resources/ui
          cp -R build resources/ui

      - name: Verify Linux binary is statically linked
        if: matrix.os == 'linux'
        shell: bash
        run: |
          BIN=resources/bin/cab
          file "$BIN"
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "$LDD_OUT"
          if ! echo "$LDD_OUT" | grep -Eiq 'not a dynamic|statically linked'; then
            echo "ERROR: expected a statically linked musl binary" >&2
            exit 1
          fi
          if readelf -d "$BIN" 2>/dev/null | grep -q 'Shared library:'; then
            echo "ERROR: binary has DT_NEEDED shared libraries" >&2
            readelf -d "$BIN" | grep 'Shared library:' || true
            exit 1
          fi
          "$BIN" --version

      - name: Package CLI archive
        shell: bash
        run: |
          chmod +x scripts/package-cli.sh scripts/install.sh
          ./scripts/package-cli.sh "${{ matrix.os }}" "${{ matrix.arch }}" dist/cli

      - name: Upload CLI archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          if [[ "$OS" == "windows" ]]; then
            ASSET="dist/cli/cab-${OS}-${ARCH}.zip"
          else
            ASSET="dist/cli/cab-${OS}-${ARCH}.tar.gz"
          fi
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cab-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/cli/*
          if-no-files-found: error

  # Auto-publish the draft release once every platform artifact has been
  # uploaded. The release stays draft while builds run so users never see a
  # published release missing binaries; publish is skipped (release remains
  # draft) if any build job fails or is skipped.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-cli.result == 'success'
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
